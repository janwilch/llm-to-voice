name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: ${{ matrix.os-name }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os-name: [linux, windows]
        preset: [release, release-vulkan]
        include:
          - os-name: linux
            runner: ubuntu-latest
          - os-name: windows
            runner: windows-latest
    defaults:
      run:
        shell: ${{ matrix.os-name == 'windows' && 'msys2 {0}' || 'bash' }}
        working-directory: cpp

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain (Linux)
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
          if [ "${{ matrix.preset }}" = release-vulkan ]; then
            sudo apt-get install -y libvulkan-dev glslc spirv-headers
          fi

      - name: Install toolchain (Windows, MSYS2 CLANG64)
        if: matrix.os-name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-shaderc
            mingw-w64-clang-x86_64-spirv-headers

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Model-free tests only. The Vulkan build is not run: the runners have no GPU.
      - name: Test
        if: matrix.preset == 'release'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - uses: actions/upload-artifact@v5
        with:
          name: llmvoice-${{ matrix.os-name }}-${{ matrix.preset }}
          # Just the deliverables, not the test executables next to them.
          path: |
            cpp/build/${{ matrix.preset }}/bin/llmvoice_cpp
            cpp/build/${{ matrix.preset }}/bin/llmvoice_cpp.exe
            cpp/build/${{ matrix.preset }}/bin/llmvoice.so
            cpp/build/${{ matrix.preset }}/bin/llmvoice.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for d in llmvoice-*; do (cd "$d" && zip -r "../$d.zip" .); done
          gh release create "${{ github.ref_name }}" *.zip \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
