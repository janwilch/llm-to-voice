[project]
name = "llmvoice"
version = "0.1.0"
description = "Streaming local LLM -> voice with an out-of-band style channel"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "stream2sentence[nltk]>=0.4.0",
]

[project.optional-dependencies]
# Heavy GPU path. Installed separately so the pipeline can be developed and
# tested against the fake TTS backend without pulling ~3 GB of wheels.
# Exact pins, not ranges: this stack is version-fragile (see README "GPU setup")
# and every version below is a verified-working combination on sm_120.
cuda = [
    "torch==2.11.0",
    # Also pulled in transitively by faster-qwen3-tts, but listed here so the
    # cu128 index pin below applies: uv sources only bind the project's own
    # deps, not transitive ones. The plain PyPI wheel is built against CUDA 13
    # and dies on `import torchaudio` with `libcudart.so.13: cannot open
    # shared object file` against a cu128 torch.
    "torchaudio==2.11.0",
    # Ceiling, not just a pin. qwen-tts-hf requires transformers>=5.15.1,<6 but
    # its rotary modules still want the ROPE_INIT_FUNCTIONS["default"] entry 5.x
    # deleted, so it reinstalls one that reads the 4.x `config.rope_theta`.
    # Through 5.15.1 that is harmless: `_init_weights` routes rope_type
    # "default" to each model's own `compute_default_rope_parameters` and never
    # consults the registry. 5.16+ refactored it to
    # `{..., "default": module.compute_default_rope_parameters,
    #   **ROPE_INIT_FUNCTIONS}` — registry last — so the reinstalled entry
    # shadows every model's own default, and loading the Mimi codec fails with
    # `AttributeError: 'MimiConfig' object has no attribute 'rope_theta'`
    # (5.x moved theta into `config.rope_parameters`). Raise this only after
    # checking upstream reads `rope_parameters`.
    "transformers==5.15.1",
    "faster-qwen3-tts==0.4.0",
    "qwen-tts-hf==0.1.1.post1",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[project.scripts]
llmvoice = "llmvoice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmvoice"]

# --- Blackwell (sm_120) note -------------------------------------------------
# The RTX 50-series needs a cu128/cu130 torch build; the default PyPI wheel may
# not carry sm_120 kernels. See README "GPU setup" and pytorch/pytorch#164342.
# A cu128 wheel will not load against a cu130 build or vice versa.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
